<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tunnel — sea of glass</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <style>
    :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #c4945a; --text-dim: #8a6a3e; --accent: #c4945a; --mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--mono); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    .toolbar { display: flex; gap: 0.5rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); align-items: center; flex-shrink: 0; }
    .toolbar a { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; margin-right: 0.5rem; }
    .toolbar a:hover { color: var(--text); }
    .toolbar input { flex: 1; background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.35rem 0.6rem; font: inherit; font-size: 0.7rem; outline: none; }
    .toolbar input:focus { border-color: var(--accent); }
    .toolbar button { background: none; border: 1px solid var(--border); color: var(--text); padding: 0.35rem 0.7rem; font: inherit; font-size: 0.7rem; cursor: pointer; flex-shrink: 0; }
    .toolbar button:hover { border-color: var(--text); }
    .frame { flex: 1; border: none; width: 100%; background: white; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.5rem; }
    .empty p { font-size: 0.7rem; color: var(--text-dim); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="/">glass</a>
    <input type="text" id="url" placeholder="enter url..." autofocus>
    <button onclick="go()">go</button>
    <button onclick="back()">←</button>
    <button onclick="fwd()">→</button>
  </div>
  <div class="empty" id="empty">
    <p>enter a URL above to browse through the tunnel</p>
    <p style="opacity:0.4;font-size:0.6rem">static/simple sites work best — JS-heavy SPAs may break</p>
  </div>
  <iframe class="frame hidden" id="frame"></iframe>
  <script>
    const PROXY = '/s/tunnel?url=';
    const urlInput = document.getElementById('url');
    const frame = document.getElementById('frame');
    const empty = document.getElementById('empty');
    const history = [];
    let histIdx = -1;

    function go(targetUrl) {
      let u = targetUrl || urlInput.value.trim();
      if (!u) return;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      urlInput.value = u;
      frame.src = PROXY + encodeURIComponent(u);
      frame.classList.remove('hidden');
      empty.classList.add('hidden');
      history.push(u);
      histIdx = history.length - 1;
    }

    function back() {
      if (histIdx > 0) { histIdx--; go(history[histIdx]); }
    }

    function fwd() {
      if (histIdx < history.length - 1) { histIdx++; go(history[histIdx]); }
    }

    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

    // Load from hash
    if (location.hash.slice(1)) {
      urlInput.value = decodeURIComponent(location.hash.slice(1));
      go();
    }
  </script>
</body>
</html>
