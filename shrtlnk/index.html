<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>short — sea of glass</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #c4945a; --text-dim: #8a6a3e; --accent: #c4945a; --mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--mono); background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 1.1rem; font-weight: 400; color: var(--accent); margin-bottom: 0.3rem; letter-spacing: 0.05em; }
    h1 a { color: var(--accent); text-decoration: none; }
    h1 a:hover { text-decoration: underline; }
    .subtitle { font-size: 0.65rem; color: var(--text-dim); margin-bottom: 2rem; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.5rem; font: inherit; font-size: 0.75rem; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: none; border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.8rem; font: inherit; font-size: 0.7rem; cursor: pointer; white-space: nowrap; }
    button:hover { border-color: var(--text); }
    .result-box { background: var(--surface); border: 1px solid var(--border); padding: 0.8rem; font-size: 0.75rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 1rem; word-break: break-all; }
    .sep { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .section-label { font-size: 0.65rem; color: var(--text-dim); margin-bottom: 0.75rem; }
    .error { color: #944; font-size: 0.75rem; margin-top: 0.5rem; }
    .copied { color: var(--text-dim); font-size: 0.65rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1><a href="/">glass</a> / short</h1>
    <div class="subtitle">url shortener</div>

    <div class="row">
      <input type="text" id="url" placeholder="https://example.com/some/long/url" autofocus>
      <button id="btn-shorten" onclick="shorten()">shorten</button>
    </div>
    <div id="shorten-result"></div>
    <div id="shorten-error" class="error"></div>

    <hr class="sep">

    <div class="section-label">resolve short id</div>
    <div class="row">
      <input type="text" id="short-id" placeholder="short id (e.g. a1b2c3)">
      <button onclick="go()">go</button>
    </div>
    <div id="go-error" class="error"></div>
  </div>
  <script>
    const WORKER = 'https://crystal.seaofglass.workers.dev';
    document.getElementById('url').addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });
    document.getElementById('short-id').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

    async function shorten() {
      const url = document.getElementById('url').value.trim();
      const errEl = document.getElementById('shorten-error');
      const resEl = document.getElementById('shorten-result');
      errEl.textContent = '';
      resEl.innerHTML = '';
      if (!url) { errEl.textContent = 'enter a url'; return; }
      document.getElementById('btn-shorten').textContent = '...';
      try {
        const res = await fetch(`${WORKER}/s/go`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        resEl.innerHTML = `<div class="result-box"><span>${esc(data.url)}</span><button onclick="copyUrl('${esc(data.url)}', this)">copy</button></div>`;
      } catch (e) {
        errEl.textContent = e.message;
      } finally {
        document.getElementById('btn-shorten').textContent = 'shorten';
      }
    }

    function go() {
      const id = document.getElementById('short-id').value.trim();
      const errEl = document.getElementById('go-error');
      errEl.textContent = '';
      if (!id) { errEl.textContent = 'enter a short id'; return; }
      window.location.href = `${WORKER}/s/go/${encodeURIComponent(id)}`;
    }

    async function copyUrl(url, btn) {
      try {
        await navigator.clipboard.writeText(url);
        btn.textContent = 'copied';
        setTimeout(() => btn.textContent = 'copy', 1500);
      } catch {
        btn.textContent = 'failed';
        setTimeout(() => btn.textContent = 'copy', 1500);
      }
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  </script>
</body>
</html>
